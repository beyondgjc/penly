[versions]
# AGP 8.9.1（2026-09-17）：compileSdk 36 的官方最低推荐 AGP；需 Gradle 8.11.1（已随 wrapper 升级）。
# 本机 AS 需 Meerkat | 2024.3.1 及以上才支持（Ladybug 2024.2.1 的 AGP 上限为 8.7）——升级 IDE 后 sync 即可
agp = "8.9.1"
kotlin = "2.0.0"
coreKtx = "1.13.1"
junit = "4.13.2"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.04.01"
navigationCompose = "2.7.7"
datastore = "1.1.1"
kotlinxSerialization = "1.7.1"
# 钉 1.1.0 stable（2026-09-17 决策）：1.2 线无 stable（maven 仅 alpha01-05，之后跳
# 1.4.0-alpha），用户拍板只用 stable。1.1.0 与 fragment 1.9.0 组合：fragment 的
# requestCode 低 16 位强校验在 1.3.0+ 已移除，BiometricPrompt 依赖的 FragmentActivity
# API 在 1.9 线保留——构建与指纹解锁回归验证确认。
biometric = "1.1.0"
# 1.9.0（2026-09-17）：1.9 线最新 stable；依赖 compileSdk 36（已满足）。
# 会拉高 lifecycle/activity/core 传递依赖（gradle 冲突解决取最高，均为 AndroidX 兼容性 minor 升级）
fragmentKtx = "1.9.0"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
pinyin4j = "2.5.1"
# 扫码录入 2FA 密钥：zxing-android-embedded 自带取景 Activity 与相机权限流程，
# 单依赖 ~1.5MB，替代 CameraX+ML Kit 重方案（v3.0 项目④ V2）
zxingEmbedded = "4.3.0"
# crypto-core（纯 JVM 加密内核，无 Android 依赖）：coroutines 供 KeySession 的
# unlocked StateFlow；BouncyCastle 与 app 同版本（同一处 Argon2 实现，避免两套代码）。
coroutines = "1.8.0"
bouncycastle = "1.78.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# 显式升级 fragment ≥1.3.0：见 [versions] fragmentKtx 注释
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
pinyin4j = { group = "com.belerweb", name = "pinyin4j", version.ref = "pinyin4j" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbedded" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
