<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>印迹 应用图标方案</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6;padding:32px;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
  h1{width:100%;text-align:center;color:#1A1D24;font-size:22px;font-weight:700;margin-bottom:8px}
  .sub{width:100%;text-align:center;color:#8A909C;font-size:13px;margin-bottom:16px}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.08);width:210px;text-align:center}
  .card img{width:168px;height:168px;border-radius:34px}
  .card .tag{display:inline-block;margin-top:12px;font-size:11px;font-weight:600;color:#07C160;background:#E6F9EF;padding:3px 10px;border-radius:10px}
  .card .n{margin-top:10px;font-size:15px;font-weight:600;color:#1A1D24}
  .card .d{font-size:12px;color:#8A909C;margin-top:4px;line-height:1.4}
</style>
</head>
<body>
  <h1>印迹 印迹 · 应用图标方案</h1>
  <div class="sub">全部套用品牌绿 #07C160 · 扁平风 · 点击挑选后告知我编号即可</div>

  <div class="card">
    <img src="yinji-icon-1-shield.svg" />
    <div class="tag">方案 1</div>
    <div class="n">盾牌 + 钥匙孔</div>
    <div class="d">最经典的安全语义，强识别、跨尺寸清晰</div>
  </div>
  <div class="card">
    <img src="yinji-icon-2-lock.svg" />
    <div class="tag">方案 2</div>
    <div class="n">智能锁（浅底）</div>
    <div class="d">白底绿锁，干净轻盈，与系统风格贴近</div>
  </div>
  <div class="card">
    <img src="yinji-icon-3-vault.svg" />
    <div class="tag">方案 3</div>
    <div class="n">保险箱</div>
    <div class="d">「本地保险箱」隐喻，强调数据自托管</div>
  </div>
  <div class="card">
    <img src="yinji-icon-4-key.svg" />
    <div class="tag">方案 4</div>
    <div class="n">钥匙（浅底）</div>
    <div class="d">柔和浅绿底 + 绿钥匙，差异化更显轻快</div>
  </div>
  <div class="card">
    <img src="yinji-icon-5-hexagon.svg" />
    <div class="tag">方案 5</div>
    <div class="n">六边形 + 钥匙孔</div>
    <div class="d">几何现代感，科技/加密调性更强</div>
  </div>
  <div class="card" style="outline:3px solid #07C160;outline-offset:-1px">
    <img src="yinji-icon-6-fingerprint.svg" />
    <div class="tag" style="color:#fff;background:#07C160">✓ 已采用 · 方案 6</div>
    <div class="n">指纹</div>
    <div class="d">呼应 App 的生物识别解锁差异化能力</div>
  </div>
</body>
</html>
