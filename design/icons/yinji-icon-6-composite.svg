<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 印迹应用图标 · 指纹 v3（2026-09-20 收口改版）
       规格：1024 画布 / 底色圆角 224（21.9%）/ 字形外接盒归一至画布 64%
       本次改版动因：v2 的五条竖笔底端为 764/784/800/688/700，
         左三条长（244-280）右两条短（168-180），极差 112 —— 呈「三长两短」，
         且左右不对称（左重右轻）。
       改法：只调收口位置，让底端轮廓成左右镜像的 V 形（碗形）——
         外拱腿底 764/700 → 720/720     （腿长 200）
         内拱腿底 784/688 → 770/770     （腿长 250）
         中轴底   800     → 800         （腿长 280）
       结果：五条竖笔长度 200/250/280/250/200，极差 112→80，
         轮廓由「左低右高断层」变为平滑 V 形，视觉上模仿指腹按下的弧边。
       外接盒未变（676×656，中心 512,510）→ 归一化系数 0.96947 保持不变。 -->
  <rect width="1024" height="1024" rx="224" fill="#07C160"/>
  <g transform="translate(512 510) scale(0.96947) translate(-512 -510)"
     fill="none" stroke="#FFFFFF" stroke-width="76"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M212 720 V520 A300 300 0 0 1 812 520 V720"/>
    <path d="M362 770 V520 A150 150 0 0 1 662 520 V770"/>
    <path d="M512 520 V800"/>
  </g>
</svg>
